name: build

on:
  push:
  pull_request:
jobs:
  macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Build and Test
        run: |
          xcodebuild -scheme "Fallback" -destination 'platform=macOS' clean build test -enableCodeCoverage YES -derivedDataPath Build/
          xcrun llvm-cov export -format=lcov \
            -instr-profile Build/Build/ProfileData/*/Coverage.profdata \
            Build/Build/Products/Debug/Fallback.o > info.lcov
      - name: Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./info.lcov
          disable_search: true
          env_vars: MD_APPLE_SDK_ROOT,RUNNER_OS,RUNNER_ARCH

  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: swift:5.10-jammy
            command: swift build
          - image: swift:6.0-jammy
            command: swift test
          - image: swift:latest
            command: swift test
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
      options: --cap-add=SYS_PTRACE --security-opt seccomp=unconfined --security-opt apparmor=unconfined
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Build and Test
        run: ${{ matrix.command }}

  swiftwasm_build:
    runs-on: ubuntu-latest
    container: swift:6.0.3
    steps:
      - uses: actions/checkout@v3
      - uses: swiftwasm/setup-swiftwasm@v2.1
      - name: Build
        run: swift build --swift-sdk wasm32-unknown-wasi
